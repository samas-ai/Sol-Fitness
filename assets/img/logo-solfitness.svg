<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96" role="img" aria-label="Solfitness Academia">
  <!--
    LOGOTIPO PROVISÓRIO — a logo oficial da Solfitness não foi fornecida.
    Substitua ESTE arquivo pela logo oficial (SVG preferencialmente, ou PNG com
    fundo transparente) mantendo o mesmo nome: logo-solfitness.svg
    Não é necessário alterar o HTML. A logo é exibida com object-fit: contain,
    portanto não sofre distorção, qualquer que seja a proporção do arquivo.
  -->
  <g transform="translate(48 48)">
    <circle r="16" fill="#FF7A00"/>
    <g stroke="#FF7A00" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-26" x2="0" y2="-34"/>
      <line x1="0" y1="26" x2="0" y2="34"/>
      <line x1="-26" y1="0" x2="-34" y2="0"/>
      <line x1="26" y1="0" x2="34" y2="0"/>
      <line x1="-18.4" y1="-18.4" x2="-24" y2="-24"/>
      <line x1="18.4" y1="18.4" x2="24" y2="24"/>
      <line x1="18.4" y1="-18.4" x2="24" y2="-24"/>
      <line x1="-18.4" y1="18.4" x2="-24" y2="24"/>
    </g>
  </g>
  <text x="88" y="56" textLength="84" lengthAdjust="spacingAndGlyphs"
        font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="40" font-weight="800" fill="#FFFFFF">SOL</text>
  <text x="176" y="56" textLength="158" lengthAdjust="spacingAndGlyphs"
        font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="40" font-weight="800" fill="#FF7A00">FITNESS</text>
  <text x="90" y="76" textLength="120" lengthAdjust="spacingAndGlyphs"
        font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="11" font-weight="600" fill="#9A9AA4">ACADEMIA</text>
</svg>
